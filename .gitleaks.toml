title = "VArt gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Firebase web API keys публичны по дизайну (защита — в правилах Firestore, не в ключе)"
paths = [
  '''ourworld\.html$''',
  '''jobsil\.html$''',
  '''Yulia\+Katia/.*\.html$''',   # ложное срабатывание: встроенные base64-картинки
  '''yulia/index\.html$''',   # Supabase publishable key (sb_publishable_...) — публичный по дизайну, защита в RLS
]
regexTarget = "line"
regexes = [
  '''SUPABASE_KEY''',   # только sb_publishable_ (публичный по дизайну; проверено по всей истории — secret/service_role ключей нет)
]
