<style>

.logo{font-weight:800;font-size:calc(18px*var(--fs));letter-spacing:.3px;margin-inline-end:4px}.logo b{color:var(--ac)}
#q{flex:1;min-width:140px;padding:11px 12px;font-size:calc(16px*var(--fs));border-radius:10px;border:1px solid #2b3858;background:var(--card);color:var(--tx)}

.tab{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid #2b3858;background:var(--card);cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(135px*var(--fs)),1fr));gap:12px}

#plwrap{position:relative}

#plbar .ttl{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:calc(14px*var(--fs))}
#plstrip{display:none;overflow-x:auto;gap:8px;padding:6px 8px;background:var(--card)}
#plstrip img{height:60px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer;flex:none}
#plfab{display:none}
#plwrap:fullscreen #plbar{position:absolute;top:0;left:0;right:0;background:rgba(10,15,30,.92);transform:translateY(-120%);transition:transform .2s;z-index:3}
#plwrap:fullscreen #plstrip{position:absolute;top:58px;left:0;right:0;background:rgba(10,15,30,.92);transform:translateY(-300%);transition:transform .2s;z-index:3}
#plwrap:fullscreen.show #plbar,#plwrap:fullscreen.show #plstrip{transform:none}
#plwrap:fullscreen #plstrip{display:flex}
#plwrap:fullscreen #plfab{display:block;position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:4;opacity:.45;width:44px;height:44px;border-radius:50%;padding:0}

  none:'אין מידע על זמינות במדינה זו. נסו מדינה אחרת למעלה.',open:'פתיחת עמוד השירותים',add:'＋ לרשימה שלי',rm:'✓ ברשימה, להסיר',close:'סגירה',
  empty:'עדיין ריק.',freeTitle:'בחינם ובחוקיות',freeNote:'סרטים ברשות הציבור או ברישיון פתוח. כל מקור נבדק ידנית על ידי מנהל הקטלוג.',watch:'צפייה',license:'רישיון',source:'מקור',

  set:'הגדרות',tmdbKey:'מפתח TMDB (לבדיקה אישית)',workerUrl:'כתובת Worker (לאתר ציבורי)',save:'שמירה',err:'טעינת הנתונים נכשלה',seasons:'עונות',min:'דק׳',
  attr:'תוכנה זו משתמשת ב-API של TMDB אך אינה מאושרת או מוסמכת על ידי TMDB. נתוני הזמינות מסופקים על ידי JustWatch.',

  more:'הצג עוד',
  addLink:'＋ הוספת קישור',addTitle:'הוספת סרט לפי קישור',linkLbl:'קישור (YouTube, Vimeo, Dailymotion, archive.org)',nameLbl:'שם',yearLbl:'שנה (לא חובה)',licLbl:'רישיון / למה זה חוקי (לא חובה)',
  okLbl:'בדקתי שאפשר לצפות בסרט זה באופן חוקי',badLink:'הקישור לא מתאים: נדרש עמוד archive.org/details/… או סרטון YouTube',needName:'יש להזין שם ולסמן את התיבה',

  mySubs:'המנויים שלי',mySubsNote:'סמנו את הפלטפורמות שאתם כבר מנויים עליהן. בכרטיס הסרט Kino יציג מה זמין לכם ויפתח את הסרט בפלטפורמה המתאימה. הבחירה נשמרת רק במכשיר זה.',haveIt:'זמין לכם',openOn:'פתיחה ב-',notMine:'לא מהמנויים שלכם',noneMine:'זה לא זמין בפלטפורמות שלכם.',pickSubs:'בחירת המנויים שלי',launch:'פתיחת השירותים שלי',subscribe:'הרשמה למנוי',plMore:'הצג עוד',plNone:'אין ברשימה סרטים שאפשר לצפות בהם כאן.',plErr:'טעינת הרשימה נכשלה, מוצג נגן רגיל.',plNote:'מוצגים רק סרטים שהבעלים אישר להטמיע.',affNote:'קישור שותפים: Kino עשויה לקבל עמלה, המחיר עבורכם לא משתנה.'}
};
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = LS.get('kino_lang','ru'), region = LS.get('kino_region','IL'), tab = 'home', query = '';
let fs = parseFloat(LS.get('kino_fs','1'))||1;
const t = k => T[lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tmdbLang = () => lang==='he'?'he-IL':'ru-RU';

/* ===== API ===== */
function apiMode(){
  const w = (LS.get('kino_api','')||WORKER_URL).trim().replace(/\/+$/,'');
  if (w) return {base:w, key:''};
  const k = LS.get('kino_tmdbkey','').trim();
  if (k) return {base:'https://api.themoviedb.org/3', key:k};
  return null;
}
async function api(path, params){
  const m = apiMode(); if (!m) throw new Error('nokey');
  const u = new URL(m.base + path);
  Object.entries(Object.assign({language:tmdbLang(), include_adult:'false'}, params||{})).forEach(([k,v])=>{ if (v!==''&&v!=null) u.searchParams.set(k,v); });
  if (m.key) u.searchParams.set('api_key', m.key);
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error('http '+r.status);
  return r.json();
}

/* ===== Список ===== */
const getList = () => { try{ const v=JSON.parse(LS.get('kino_list','[]')); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const setList = a => LS.set('kino_list', JSON.stringify(a));

/* ===== Рендер карточек ===== */
function poster(p){ return p ? `<img loading="lazy" alt="" src="${IMG}w342${esc(p)}">` : '<div class="ph" aria-hidden="true">🎬</div>'; }
function cards(items){
  return `<div class="grid">${items.map(i=>{
    const media = i.media_type || i._m;
    const title = i.title || i.name || '';
    const date = (i.release_date || i.first_air_date || '').slice(0,4);
    const r = i.vote_average ? '★ '+i.vote_average.toFixed(1) : '';
    return `<button class="card" data-open="${esc(media)}:${esc(i.id)}">${poster(i.poster_path)}<div class="t">${esc(title)}</div><div class="m">${esc(date)} ${esc(r)}</div></button>`;
  }).join('')}</div>`;
}
const onlyTitles = a => (a||[]).filter(x => (x.media_type?x.media_type==='movie'||x.media_type==='tv':true) && !x.adult);
function tag(arr, m){ return (arr||[]).map(x=>Object.assign({_m:m},x)); }

/* ===== Вкладки ===== */
const TABS = ['home','movies','tv','anime','free','services','list'];
function drawTabs(){
  $('tabs').innerHTML = TABS.map(k=>`<button class="tab ${tab===k&&!query?'on':''}" data-tab="${k}">${esc(t(k))}</button>`).join('');
}
function setup(){
  return `<div class="box warn"><h2>${esc(t('setup'))}</h2><p>${esc(t('setupTxt'))}</p><button class="btn" data-act="settings">⚙ ${esc(t('set'))}</button></div>`;
}
async function render(){
  const el = $('main'); drawTabs();
  document.documentElement.lang = lang; document.documentElement.dir = lang==='he'?'rtl':'ltr';
  $('q').placeholder = t('search'); $('btnLang').textContent = lang==='ru'?'HE':'RU';
  $('foot').innerHTML = `<p>${esc(t('legal'))}</p><p>${esc(t('attr'))}</p>`;
  if (tab==='free' && !query) return renderFree(el);
  if (tab==='services' && !query) return renderServices(el);
  if (tab==='list' && !query) return renderList(el);
  if (!apiMode()){ el.innerHTML = setup(); return; }
  el.innerHTML = '<p class="muted">…</p>';
  try{
    if (query){
      const r = await api('/search/multi', {query});
      const items = onlyTitles(r.results);
      el.innerHTML = `<h2>${esc(t('results'))}</h2>` + (items.length ? cards(items) : `<p class="muted">${esc(t('nores'))}</p>`);
      return;
    }
    let items=[], head=t('trend');
    if (tab==='home'){ items = onlyTitles((await api('/trending/all/week')).results); }
    else if (tab==='movies'){ items = tag((await api('/trending/movie/week')).results,'movie'); head=t('movies'); }
    else if (tab==='tv'){ items = tag((await api('/trending/tv/week')).results,'tv'); head=t('tv'); }

function parseLink(u){
  let x; try{ x=new URL(String(u).trim()); }catch(e){ return null; }
  if (x.protocol!=='https:') return null;
  const h=x.hostname.replace(/^www\./,'').replace(/^m\./,'');
  let m;
  const yt = (src,ref,s2)=>({source:src,ref:ref,src:s2});
  if (h==='archive.org' && (m=x.pathname.match(/^\/(?:details|embed)\/([A-Za-z0-9._-]+)/))) return yt('archive',m[1],'https://archive.org/details/'+m[1]);
  if (h==='youtu.be' && (m=x.pathname.match(/^\/([A-Za-z0-9_-]{11})/))) return yt('youtube',m[1],'https://www.youtube.com/watch?v='+m[1]);
  if (h==='youtube.com'){
    const list=x.searchParams.get('list');
    if (x.pathname==='/playlist' && list && /^[A-Za-z0-9_-]{10,60}$/.test(list)) return yt('youtube-list',list,'https://www.youtube.com/playlist?list='+list);
    if ((m=x.pathname.match(/^\/channel\/UC([A-Za-z0-9_-]{22})/))) return yt('youtube-list','UU'+m[1],'https://www.youtube.com/channel/UC'+m[1]);
    if ((m=x.pathname.match(/^\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})/))) return yt('youtube',m[1],'https://www.youtube.com/watch?v='+m[1]);
    if (x.pathname==='/watch' && list && /^(PL|UU|OLAK)[A-Za-z0-9_-]{8,60}$/.test(list)) return yt('youtube-list',list,'https://www.youtube.com/playlist?list='+list);
    const v=x.searchParams.get('v'); if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return yt('youtube',v,'https://www.youtube.com/watch?v='+v);
  }
  if (h==='vimeo.com' && (m=x.pathname.match(/^\/(?:video\/)?(\d{5,12})/))) return yt('vimeo',m[1],'https://vimeo.com/'+m[1]);
  if (h==='dailymotion.com' && (m=x.pathname.match(/^\/(?:embed\/)?video\/([A-Za-z0-9]{5,12})/))) return yt('dailymotion',m[1],'https://www.dailymotion.com/video/'+m[1]);
  return null;
}
function embedSrc(it){
  switch(it.source){
    case 'youtube': return 'https://www.youtube-nocookie.com/embed/'+it.ref+'?rel=0&playsinline=1&iv_load_policy=3';
    case 'youtube-list': return 'https://www.youtube-nocookie.com/embed/videoseries?list='+it.ref+'&rel=0&playsinline=1&iv_load_policy=3';
    case 'vimeo': return 'https://player.vimeo.com/video/'+it.ref+'?title=0&byline=0&portrait=0';
    case 'dailymotion': return 'https://www.dailymotion.com/embed/video/'+it.ref;
    default: return 'https://archive.org/embed/'+it.ref;
  }
}
function thumbUrl(it){
  if (it.source==='youtube') return 'https://i.ytimg.com/vi/'+it.ref+'/hqdefault.jpg';
  if (it.source==='dailymotion') return 'https://www.dailymotion.com/thumbnail/video/'+it.ref;
  if (it.source==='archive') return 'https://archive.org/services/img/'+it.ref;
  return '';
}

function plPlay(id, auto){
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  const box = $('plplayer'); if (!box) return;
  if (plSt) plSt.cur = id;
  const src = embedSrc({source:'youtube',ref:id}) + '&fs=0&enablejsapi=1&origin=' + encodeURIComponent(location.origin) + (auto?'&autoplay=1':'');
  box.innerHTML = `<iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups" referrerpolicy="strict-origin-when-cross-origin" title="video"></iframe>`;
  const f = box.querySelector('iframe');

  const v = plSt && plSt.items.find(x=>x.id===id); const tt = $('pltitle'); if (tt) tt.textContent = v ? v.title : '';

async function plStep(d){
  const st = plSt; if (!st || !st.items.length) return;
  let i = st.items.findIndex(v=>v.id===st.cur) + d;
  if (i < 0) return;
  if (i >= st.items.length){ if (st.next && !st.busy) await plLoad(); if (plSt!==st || i >= st.items.length) return; }
  plPlay(st.items[i].id, true);
}

async function plLoad(){
  const st = plSt; if (!st || st.busy) return; st.busy = true;

  try{
    const r = await fetch(base+'/yt/playlist?list='+encodeURIComponent(st.ref)+(st.next?'&page='+encodeURIComponent(st.next):''));
    if (!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    if (plSt !== st || !$('plgrid')) return;
    const g = $('plgrid');
    g.insertAdjacentHTML('beforeend', (j.items||[]).map(v=>`<button class="card" data-yt="${esc(v.id)}"><img loading="lazy" style="aspect-ratio:16/9" alt="" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg"><div class="t">${esc(v.title)}</div></button>`).join(''));
    (j.items||[]).forEach(v=>st.items.push(v));
    const sp = $('plstrip'); if (sp) sp.insertAdjacentHTML('beforeend', (j.items||[]).map(v=>`<img data-yt="${esc(v.id)}" loading="lazy" alt="${esc(v.title)}" title="${esc(v.title)}" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg">`).join(''));
    st.next = j.next||''; st.shown += (j.items||[]).length;
    if (!st.started && (j.items||[]).length){ st.started = true; plPlay(j.items[0].id, false); }
    if (!g.children.length && !st.next) $('plmsg').textContent = t('plNone');
    $('plmore').style.display = (st.next && st.auto >= 40) ? '' : 'none';
    // если на странице попались только запрещённые фильмы, подгружаем дальше сами
    if (st.next && st.auto < 40){ st.auto++; st.busy=false; return await plLoad(); }
  }catch(e){
    if (plSt === st && !st.started && $('plplayer')){ $('plmsg').textContent = t('plErr'); $('plplayer').innerHTML = `<iframe src="${esc(embedSrc({source:'youtube-list',ref:st.ref}))}" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation allow-popups" referrerpolicy="strict-origin-when-cross-origin" title="playlist"></iframe>`; $('plmore').style.display='none'; }
  }finally{ st.busy = false; }
}
function openFree(id){
  const it = ($('main')._free||[]).find(x=>x.id===id); if (!it) return;
  const src = embedSrc(it);
  const ti = (it.title&&(it.title[lang]||it.title.en||it.title.ru))||'';
  const link = /^https:\/\/(archive\.org|www\.youtube\.com|vimeo\.com|www\.dailymotion\.com)\//.test(it.src||'') ? `<a target="_blank" rel="noopener noreferrer" href="${esc(it.src)}">${esc(t('source'))}</a>` : '';
  const d = $('dlg');
  d.innerHTML = `<button class="btn sec x" data-act="close">${esc(t('close'))}</button><h2 style="margin-top:0">${esc(ti)} <span class="muted">${esc(it.year||'')}</span></h2>
    ${it.source==='youtube-list' ? `<div id="plwrap"><div id="plplayer"></div><div id="plbar"><button class="btn sec" data-act="plprev" aria-label="prev">◀</button><span class="ttl" id="pltitle"></span><button class="btn sec" data-act="plnext" aria-label="next">▶</button><button class="btn sec" data-act="plfs" aria-label="fullscreen">⛶</button></div><div id="plstrip"></div><button class="btn sec" id="plfab" data-act="plmenu" aria-label="menu">☰</button></div><p id="plmsg" class="small muted">${esc(t('plNote'))}</p><div class="grid" id="plgrid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))"></div><p><button class="btn sec" id="plmore" data-act="plmore" style="display:none">${esc(t('plMore'))}</button></p>` : `<iframe src="${esc(src)}" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation allow-popups" referrerpolicy="strict-origin-when-cross-origin" title="${esc(ti)}"></iframe>`}
    <p class="small muted">${esc(t('license'))}: ${esc(it.license||'')} ${link}</p>` +
    (it.db && isAdmin() ? `<p><button class="btn sec" data-act="dellink" data-id="${esc(it.dbId)}">${esc(t('del'))}</button></p>` : '');
  d.showModal();
  plSt = null;
  if (it.source==='youtube-list'){ plSt = {ref:it.ref,next:'',shown:0,auto:0,started:false,busy:false,items:[],cur:''}; plLoad(); }
}
function openSettings(){
  const d = $('dlg');
  d.innerHTML = `<button class="btn sec x" data-act="close">${esc(t('close'))}</button><h2 style="margin-top:0">${esc(t('set'))}</h2>
   <label for="sKey">${esc(t('tmdbKey'))}</label><input id="sKey" type="password" autocomplete="off" value="${esc(LS.get('kino_tmdbkey',''))}">
   <label for="sApi">${esc(t('workerUrl'))}</label><input id="sApi" type="text" autocomplete="off" placeholder="https://…workers.dev" value="${esc(LS.get('kino_api',''))}">
   <p><button class="btn" data-act="saveset">${esc(t('save'))}</button></p>`;
  d.showModal();
}

/* ===== События ===== */
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-open],[data-free],[data-tab],[data-act],[data-yt]'); if (!c) return;
  if (c.dataset.yt){ plPlay(c.dataset.yt, true); return; }
  if (c.dataset.tab){ tab=c.dataset.tab; query=''; $('q').value=''; render(); return; }
  if (c.dataset.open){ const [m,i]=c.dataset.open.split(':'); if (/^(movie|tv)$/.test(m)&&/^\d+$/.test(i)) openTitle(m,i); return; }
  if (c.dataset.free){ openFree(c.dataset.free); return; }
  const a = c.dataset.act;
  if (a==='close'){ $('dlg').close(); $('dlg').innerHTML=''; }
  else if (a==='settings') openSettings();
  else if (a==='plmore') plLoad();
  else if (a==='plprev') plStep(-1);
  else if (a==='plnext') plStep(1);
  else if (a==='plfs') plFs();
  else if (a==='plmenu'){ const w=$('plwrap'); if (w) w.classList.toggle('show'); }
  else if (a==='togglesub'){ e.preventDefault(); const k=c.dataset.k; let s=getSubs(); s = s.includes(k)?s.filter(x=>x!==k):s.concat(k); setSubs(s); render(); }
  else if (a==='mysubs'){ e.preventDefault(); $('dlg').close(); $('dlg').innerHTML=''; tab='services'; query=''; $('q').value=''; render(); window.scrollTo(0,0); }
  else if (a==='addlink') openAddLink();
  else if (a==='savelink') saveLink();
  else if (a==='adminlogin') openAdminLogin();
  else if (a==='dologin') doLogin();
  else if (a==='logout'){ LS.set('kino_adm',''); render(); }
  else if (a==='dellink'){ adm('/admin/del',{pw:getPw(), id:c.dataset.id}).then(r=>{ if (r.error==='bad'||r.error==='locked') LS.set('kino_adm',''); $('dlg').close(); render(); }).catch(()=>{ $('dlg').close(); render(); }); }
  else if (a==='saveset'){ LS.set('kino_tmdbkey',$('sKey').value.trim()); LS.set('kino_api',$('sApi').value.trim()); $('dlg').close(); render(); }
  else if (a==='toggle'){
    const id=+c.dataset.id, m=c.dataset.m; let l=getList();
    if (l.some(x=>x.id===id&&x.media===m)) l=l.filter(x=>!(x.id===id&&x.media===m)); else l.push({id,media:m,title:c.dataset.t,poster:c.dataset.p});
    setList(l); openTitle(m,String(id)); if (tab==='list') render();
  }
});
$('dlg').addEventListener('close', ()=>{ $('dlg').innerHTML=''; });
let tmr; $('q').addEventListener('input', e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ query=e.target.value.trim(); render(); },400); });
$('region').innerHTML = Object.entries(REGIONS).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('');
$('region').value = region; $('region').addEventListener('change', e=>{ region=e.target.value; LS.set('kino_region',region); });
$('btnLang').addEventListener('click', ()=>{ lang = lang==='ru'?'he':'ru'; LS.set('kino_lang',lang); render(); });
$('btnSet').addEventListener('click', openSettings);
const SIZES=[1,1.15,1.3,1.5];
function applyFs(){ document.documentElement.style.setProperty('--fs',fs); $('btnFs').textContent = ['Aa','A+','A++','A+++'][Math.max(0,SIZES.indexOf(fs))]; }
$('btnFs').addEventListener('click', ()=>{ fs = SIZES[(SIZES.indexOf(fs)+1)%SIZES.length]; LS.set('kino_fs',fs); applyFs(); });
if (!SIZES.includes(fs)) fs=1; applyFs(); render();
})();
</script>
