<!DOCTYPE html>
<html lang="ru" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Yulia Fit — программа тренировок</title>
<meta name="description" content="Авторская программа тренировок Юлии: упражнения с анимацией техники, таймер отдыха и прогресс. Работает без интернета."/>
<meta name="theme-color" content="#0d0c0b"/>
<meta name="color-scheme" content="dark light"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Yulia Fit"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta property="og:title" content="Yulia Fit — программа тренировок"/>
<meta property="og:description" content="Авторская программа Юлии с анимацией техники каждого упражнения."/>
<meta property="og:image" content="https://org-va.com/yulia/app/icons/icon-512.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">
    <span id="logoMark"></span>
    <div><b>Yulia Fit</b><small id="tagline"></small></div>
  </div>
  <button class="ibtn gold" id="btnInstall" hidden></button>
  <button class="ibtn" id="btnTheme" aria-label="Theme"></button>
  <button class="ibtn" id="btnLang"></button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<div class="ov" id="ovSheet"><div class="sheet" id="sheet"></div></div>
<div class="player" id="player"></div>
<div class="ov center" id="ovInst"><div class="instbox" id="inst"></div></div>
<div class="toast" id="toast"></div>

<noscript><p style="padding:30px;text-align:center">Для работы приложения включите JavaScript.</p></noscript>
<script src="figure.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
